# Base de datos del chatbot NAVASOFT: PostgreSQL con la extension pgvector.
# Encender:  docker compose up -d      Apagar:  docker compose stop
# Usuario y contrasena: archivo .env de esta carpeta.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: navasoft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - navasoft-pgdata:/var/lib/postgresql/data

volumes:
  navasoft-pgdata:
